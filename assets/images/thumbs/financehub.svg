<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="financehub-title financehub-desc">
  <title id="financehub-title">FinanceHUB</title>
  <desc id="financehub-desc">Full-stack finance app — Node.js, React, SQL</desc>

  <defs>
    <linearGradient id="bg-financehub" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b2b2c"/>
      <stop offset="100%" stop-color="#1a1a1b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg-financehub)"/>

  <g opacity="0.12" stroke="#ffdb70" stroke-width="2" fill="none">
    <polyline points="60,340 180,300 260,330 360,250 460,270 560,190 680,220"/>
    <circle cx="680" cy="220" r="6" fill="#ffdb70" stroke="none"/>
    <circle cx="560" cy="190" r="6" fill="#ffdb70" stroke="none"/>
    <circle cx="360" cy="250" r="6" fill="#ffdb70" stroke="none"/>
  </g>

  <rect x="48" y="48" width="56" height="4" fill="#ffdb70"/>

  <text x="48" y="220" font-family="'Poppins', 'Segoe UI', Arial, sans-serif" font-size="64" font-weight="600" fill="#fafafa">FinanceHUB</text>
  <text x="48" y="264" font-family="'Poppins', 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="300" fill="#c9c9c9">Full-Stack Finance App</text>

  <g font-family="'Poppins', 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="500" fill="#ffdb70">
    <rect x="48" y="352" width="92" height="34" rx="6" fill="#333" stroke="#444"/>
    <text x="94" y="374" text-anchor="middle">Node.js</text>

    <rect x="152" y="352" width="76" height="34" rx="6" fill="#333" stroke="#444"/>
    <text x="190" y="374" text-anchor="middle">React</text>

    <rect x="240" y="352" width="64" height="34" rx="6" fill="#333" stroke="#444"/>
    <text x="272" y="374" text-anchor="middle">SQL</text>
  </g>
</svg>
